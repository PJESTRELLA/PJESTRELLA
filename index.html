<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Star Collective</title>
  <link rel="stylesheet" href="landing.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <div class="header">
      <div class="header-logo-container">
        <img class="header-logo" src="resources/LOGO.png" alt="Logo">
      </div>
      <div class="header-button-container">
        <button class="header-button">Home</button>
        <button class="header-button">About</button>
        <button class="header-button">Shop</button>
      </div>
      <div class="mobile-menu-container">
        <button class="mobile-menu-button" onclick="toggleMenu()">☰ Menu</button>
      </div>
    </div>
  </header>

  <!-- Side Panel -->
  <div id="side-panel" class="side-panel">
    <button class="close-btn" onclick="toggleMenu()">×</button>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Shop</a>
  </div>

  <script>
    function toggleMenu() {
      document.getElementById("side-panel").classList.toggle("active");
    }
  </script>
</body>
</html>
